<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FlashPedz – smart flashcards and OSCE practice for medical students">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FlashPedz">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FlashPedz</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Earlier versions installed an offline cache (service worker) that kept
    // serving the old app after updates. Remove it, then start the app.
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const registration of registrations) await registration.unregister();
          if (window.caches) {
            for (const key of await caches.keys()) await caches.delete(key);
          }
          // This page was still loaded through the old cache: load it fresh.
          if (navigator.serviceWorker.controller &&
              !sessionStorage.getItem('flashpedz-cache-cleared')) {
            sessionStorage.setItem('flashpedz-cache-cleared', '1');
            location.reload();
            return;
          }
        }
      } catch (e) {
        console.warn('Could not clear the old offline cache', e);
      }
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
